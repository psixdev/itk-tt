services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - app-network

  create-test-db:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        psql -h postgres -U ${DB_USER} -d ${DB_NAME} \
          -tc "SELECT 1 FROM pg_database WHERE datname = '${DB_TEST_NAME}'" \
          | grep -q 1 \
          || psql -h postgres -U ${DB_USER} -d ${DB_NAME} \
          -c "CREATE DATABASE ${DB_TEST_NAME}"
    networks:
      - app-network

  migrate-test:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
      create-test-db:
        condition: service_completed_successfully
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_TEST_NAME}?sslmode=disable"
      - "up"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
